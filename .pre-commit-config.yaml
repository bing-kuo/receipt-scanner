repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      # .gitignore cannot stop `git add -f`, but this hook can (--no-verify still bypasses it, so CI scans too)
      - id: no-receipt-files
        name: 不可 commit 單據、圖片或輸出檔
        language: fail
        entry: 不可 commit 單據、圖片、PDF 或 result*.json(含個資),請放 repo 外
        files: '(?i)(^samples/(?!README\.md$)|\.(jpe?g|png|heic|heif|webp|tiff?|bmp|gif|pdf)$|(^|/)result[^/]*\.json$)'
